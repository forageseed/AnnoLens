[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annolens"
version = "1.2.0"
description = "Evidence-driven gene-model curation by a vision-language agent with a versioned skill, served over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["pysam>=0.21", "matplotlib>=3.7"]

[project.scripts]
annolens = "annolens.cli:main"

[tool.setuptools]
packages = ["annolens"]

[tool.setuptools.package-data]
annolens = ["skills/*.txt", "skillpack/**/*"]
